syntax = "proto3";

package embodied_ops.rpc.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

service DeviceService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Heartbeat(SessionRequest) returns (google.protobuf.Empty);
  rpc Observe(SessionRequest) returns (ValuesResponse);
  rpc Command(CommandRequest) returns (ValuesResponse);
  rpc Health(SessionRequest) returns (HealthResponse);
  rpc CalibrationState(SessionRequest) returns (CalibrationStateResponse);
  rpc Calibrate(SessionRequest) returns (google.protobuf.Empty);
  rpc Reset(ResetRequest) returns (google.protobuf.Empty);
  rpc Close(SessionRequest) returns (google.protobuf.Empty);
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_OBSERVE = 1;
  SESSION_MODE_COMMAND = 2;
}

message DescribeRequest {
  uint32 protocol_version = 1;
}

message DescribeResponse {
  uint32 protocol_version = 1;
  DeviceManifest manifest = 2;
}

message OpenRequest {
  uint32 protocol_version = 1;
  SessionMode mode = 2;
  string client_name = 3;
  string client_version = 4;
}

message OpenResponse {
  string session_id = 1;
  uint64 lease_timeout_ms = 2;
  DeviceManifest manifest = 3;
  uint64 command_timeout_ms = 4;
}

message SessionRequest {
  string session_id = 1;
}

message CommandRequest {
  string session_id = 1;
  uint64 sequence = 2;
  uint64 sent_monotonic_ns = 3;
  repeated FeatureValue values = 4;
}

message ResetRequest {
  string session_id = 1;
  optional string target = 2;
}

message ValuesResponse {
  repeated FeatureValue values = 1;
}

message FeatureValue {
  string name = 1;
  oneof payload {
    double scalar = 2;
    TensorPayload tensor = 3;
  }
}

message TensorPayload {
  string dtype = 1;
  repeated uint32 shape = 2;
  bytes data = 3;
}

message DeviceManifest {
  uint32 api_version = 1;
  string identifier = 2;
  repeated string capabilities = 3;
  repeated FeatureSpec observation_features = 4;
  repeated FeatureSpec action_features = 5;
  map<string, string> metadata = 6;
}

message FeatureSpec {
  string name = 1;
  string kind = 2;
  string dtype = 3;
  repeated uint32 shape = 4;
  optional string unit = 5;
  optional double minimum = 6;
  optional double maximum = 7;
}

message HealthResponse {
  string status = 1;
  string summary = 2;
  google.protobuf.Struct details = 3;
}

message CalibrationStateResponse {
  bool is_calibrated = 1;
}
