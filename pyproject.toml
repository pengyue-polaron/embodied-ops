[project]
name = "embodied-ops"
version = "0.3.0"
description = "Collection, evaluation, and artifact workflows for embodied AI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "PengYue" }]
keywords = ["robotics", "embodied-ai", "datasets", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pengyue-polaron/embodied-ops"
Repository = "https://github.com/pengyue-polaron/embodied-ops"
Issues = "https://github.com/pengyue-polaron/embodied-ops/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_ops = ["py.typed"]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
