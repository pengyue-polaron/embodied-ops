name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[lerobot-dataset,teleop-foxglove]" pytest ruff build
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: web
      - name: Audit production and development dependencies
        run: npm audit --offline --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- src/embodied_ops/operator_panel/assets

  teleop-foxglove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: foxglove/quest-teleop-controls/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: foxglove/quest-teleop-controls
      - run: npm run typecheck
        working-directory: foxglove/quest-teleop-controls
      - run: npm run lint
        working-directory: foxglove/quest-teleop-controls
      - name: Audit production and development dependencies
        run: npm audit --offline --audit-level=high
        working-directory: foxglove/quest-teleop-controls
      - run: npm run package
        working-directory: foxglove/quest-teleop-controls
